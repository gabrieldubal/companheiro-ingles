<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1F6B4F">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Inglês">
  <title>Companheiro de inglês</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- Ícones de traço, desenhados aqui uma vez e usados no menu. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-hoje" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4M8.5 14.5l2 2 4-4"/></symbol>
    <symbol id="i-conversar" viewBox="0 0 24 24"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v7a2.5 2.5 0 0 1-2.5 2.5H10l-4.5 3.5V16h0A1.5 1.5 0 0 1 4 14.5z"/><path d="M8.5 9h7M8.5 12h4.5"/></symbol>
    <symbol id="i-pronuncia" viewBox="0 0 24 24"><path d="M4 12h1.5M8 8v8M11.5 5v14M15 8.5v7M18.5 10.5v3M20.5 12h0"/></symbol>
    <symbol id="i-cartoes" viewBox="0 0 24 24"><rect x="6.5" y="4" width="12" height="15" rx="2" transform="rotate(8 12.5 11.5)"/><rect x="4" y="5.5" width="12" height="15" rx="2"/></symbol>
    <symbol id="i-entender" viewBox="0 0 24 24"><path d="M12 6.5C10 5 7 4.5 4 5v13c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5V5c-3-.5-6 0-8 1.5zM12 6.5v13"/></symbol>
    <symbol id="i-perguntar" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.5a2.5 2.5 0 1 1 3.4 2.3c-.6.3-1 .8-1 1.5v.4M12 17h0"/></symbol>
    <symbol id="i-falecerto" viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 0 0 3.5-3.5V7a3.5 3.5 0 0 0-7 0v5a3.5 3.5 0 0 0 3.5 3.5zM6 11.5a6 6 0 0 0 12 0M12 17.5V20"/></symbol>
    <symbol id="i-erros" viewBox="0 0 24 24"><path d="M6 3.5h9l4 4V20a.5.5 0 0 1-.5.5h-12A.5.5 0 0 1 6 20z"/><path d="M14.5 3.5V8h4.5M9 12h6M9 15.5h6"/></symbol>
    <symbol id="i-progresso" viewBox="0 0 24 24"><path d="M4 19.5h16M6.5 16l4-5 3 3 4.5-6.5"/></symbol>
    <symbol id="i-historico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="i-ajustes" viewBox="0 0 24 24"><path d="M5 7h9M18 7h1M5 17h1M10 17h9"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></symbol>
    <symbol id="i-mais" viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="18" cy="12" r="1.2"/></symbol>
  </svg>
  <div class="app">
    <!-- "extra": some do menu de baixo no celular e aparece na tela "Mais" -->
    <nav class="rail" aria-label="Navegação">
      <a class="brand" href="#/hoje"><b aria-hidden="true">θ</b><span>Companheiro<br>de inglês</span></a>
      <p class="group">Praticar</p>
      <a class="nav" href="#/hoje"><svg aria-hidden="true"><use href="#i-hoje"/></svg><span>Hoje</span></a>
      <a class="nav" href="#/conversar"><svg aria-hidden="true"><use href="#i-conversar"/></svg><span>Conversar</span></a>
      <a class="nav" href="#/pronuncia"><svg aria-hidden="true"><use href="#i-pronuncia"/></svg><span>Pronúncia</span></a>
      <a class="nav extra" href="#/fale-certo"><svg aria-hidden="true"><use href="#i-falecerto"/></svg><span>Fale certo</span></a>
      <p class="group">Estudar</p>
      <a class="nav" href="#/cartoes"><svg aria-hidden="true"><use href="#i-cartoes"/></svg><span>Cartões</span></a>
      <a class="nav extra" href="#/entender"><svg aria-hidden="true"><use href="#i-entender"/></svg><span>Entender</span></a>
      <a class="nav extra" href="#/perguntar"><svg aria-hidden="true"><use href="#i-perguntar"/></svg><span>Perguntar</span></a>
      <a class="nav extra" href="#/erros"><svg aria-hidden="true"><use href="#i-erros"/></svg><span>Meus erros</span></a>
      <p class="group">Acompanhar</p>
      <a class="nav extra" href="#/progresso"><svg aria-hidden="true"><use href="#i-progresso"/></svg><span>Progresso</span></a>
      <a class="nav extra" href="#/historico"><svg aria-hidden="true"><use href="#i-historico"/></svg><span>Histórico</span></a>
      <a class="nav extra settings" href="#/ajustes"><svg aria-hidden="true"><use href="#i-ajustes"/></svg><span>Ajustes</span></a>
      <a class="nav more" href="#/mais"><svg aria-hidden="true"><use href="#i-mais"/></svg><span>Mais</span></a>
      <p class="status" id="status" role="status"></p>
    </nav>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
  <div id="toast" role="status" hidden></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
